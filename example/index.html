<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p2p-db — IDB example</title>

  <!--
    Import map: tells the browser where to resolve bare specifiers
    (import 'libp2p', import 'wa-sqlite', etc.) without a bundler.
    All packages are loaded from esm.sh CDN at runtime.

    For production, pin exact versions:
      "libp2p": "https://esm.sh/libp2p@2.3.0"
  -->
  <script type="importmap">
  {
    "imports": {
      "libp2p":                                        "https://esm.sh/libp2p@2",
      "@libp2p/websockets":                            "https://esm.sh/@libp2p/websockets@9",
      "@libp2p/websockets/filters":                    "https://esm.sh/@libp2p/websockets@9/dist/src/filters.js",
      "@libp2p/webrtc":                                "https://esm.sh/@libp2p/webrtc@5",
      "@libp2p/circuit-relay-v2":                      "https://esm.sh/@libp2p/circuit-relay-v2@3",
      "@libp2p/bootstrap":                             "https://esm.sh/@libp2p/bootstrap@11",
      "@libp2p/pubsub-peer-discovery":                 "https://esm.sh/@libp2p/pubsub-peer-discovery@11",
      "@libp2p/identify":                              "https://esm.sh/@libp2p/identify@3",
      "@chainsafe/libp2p-gossipsub":                   "https://esm.sh/@chainsafe/libp2p-gossipsub@14",
      "@chainsafe/libp2p-noise":                       "https://esm.sh/@chainsafe/libp2p-noise@16",
      "@chainsafe/libp2p-yamux":                       "https://esm.sh/@chainsafe/libp2p-yamux@7",
      "@multiformats/multiaddr":                       "https://esm.sh/@multiformats/multiaddr@12",
      "wa-sqlite":                                     "https://esm.sh/wa-sqlite",
      "wa-sqlite/dist/wa-sqlite.mjs":                  "https://esm.sh/wa-sqlite/dist/wa-sqlite.mjs",
      "wa-sqlite/dist/wa-sqlite-async.mjs":            "https://esm.sh/wa-sqlite/dist/wa-sqlite-async.mjs",
      "wa-sqlite/src/examples/IDBBatchAtomicVFS.js":   "https://esm.sh/wa-sqlite/src/examples/IDBBatchAtomicVFS.js"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; font-size: 14px; background: #0d0d0d; color: #e0e0e0;
           display: grid; grid-template-columns: 300px 1fr; height: 100vh; overflow: hidden; }

    /* ── left panel ── */
    #sidebar { background: #141414; border-right: 1px solid #2a2a2a;
               display: flex; flex-direction: column; overflow: hidden; }
    #sidebar h2 { padding: 12px 14px; font-size: 11px; letter-spacing: .08em;
                  text-transform: uppercase; color: #666; border-bottom: 1px solid #222; }
    .info-block { padding: 12px 14px; border-bottom: 1px solid #1e1e1e; }
    .info-block label { display: block; color: #555; font-size: 11px; margin-bottom: 4px; }
    .info-block span  { color: #8ec; word-break: break-all; font-size: 12px; }
    #storage-badge { display: inline-block; padding: 2px 6px; border-radius: 3px;
                     font-size: 11px; font-weight: bold; }
    #storage-badge.idb { background: #1a3a1a; color: #4c4; }
    #storage-badge.mem { background: #3a2a1a; color: #c84; }

    /* stats text uses pre-wrap for tag breakdown lines */
    #stats-text { white-space: pre; font-size: 11px; line-height: 1.7; }

    #peer-list { flex: 1; overflow-y: auto; }
    .peer-item { padding: 6px 14px; font-size: 11px; color: #666;
                 border-bottom: 1px solid #1a1a1a; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
    .peer-item.self  { color: #8ec; }
    .peer-item.relay { color: #68a; }
    .peer-item.app   { color: #8c8; }
    #relay-addr { font-size: 10px; color: #8ec; word-break: break-all;
                  white-space: normal; cursor: pointer; }
    #relay-addr:hover { color: #aef; }
    #relay-connect { display: flex; gap: 6px; margin-top: 6px; }
    #relay-url { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
                 padding: 3px 7px; border-radius: 3px; font: inherit; font-size: 11px; }
    #relay-connect-btn { background: #1a3060; border: 1px solid #2a4a8a; color: #7af;
                         padding: 3px 8px; border-radius: 3px; cursor: pointer;
                         font: inherit; font-size: 11px; white-space: nowrap; }
    #relay-connect-btn:hover { background: #233880; }

    /* ── main area ── */
    #main { display: flex; flex-direction: column; overflow: hidden; }

    /* two-row toolbar: row 1 = add-note, row 2 = search/filter */
    #toolbar { padding: 8px 16px; border-bottom: 1px solid #2a2a2a;
               display: flex; flex-direction: column; gap: 6px; background: #111; }
    .toolbar-row { display: flex; gap: 8px; align-items: center; }
    .toolbar-row input, .toolbar-row select, .toolbar-row button {
      background: #1e1e1e; border: 1px solid #333; color: #e0e0e0;
      padding: 5px 10px; border-radius: 4px; font: inherit; }
    .toolbar-row input  { flex: 1; }
    .toolbar-row button { cursor: pointer; background: #1a3060; border-color: #2a4a8a;
                          color: #7af; white-space: nowrap; }
    .toolbar-row button:hover { background: #233880; }

    /* notes grid */
    #notes { flex: 1; overflow-y: auto; padding: 12px; display: grid;
             grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
             gap: 10px; align-content: start; }

    /* note cards — extra right padding leaves room for the 3 action buttons */
    .note-card { background: #181818; border: 1px solid #2a2a2a; border-radius: 6px;
                 padding: 12px; padding-right: 72px; position: relative; }
    .note-card.remote { border-color: #2a4a2a; background: #141e14; }
    .note-card.done   { opacity: .65; }
    .note-card .note-tag  { font-size: 10px; color: #566; text-transform: uppercase;
                            letter-spacing: .06em; margin-bottom: 6px; }
    .note-card .note-body { color: #ccc; line-height: 1.5; word-break: break-word; }
    .note-card.done .note-body { text-decoration: line-through; color: #555; }
    .note-card .note-meta { margin-top: 8px; font-size: 10px; color: #444;
                            display: flex; justify-content: space-between; }

    /* three-button action strip in the top-right corner of each card */
    .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
    .card-actions button { background: none; border: none; cursor: pointer;
                           font-size: 14px; line-height: 1; padding: 1px 3px; color: #444; }
    .card-actions .done-btn:hover   { color: #4b4; }
    .card-actions .done-btn.active  { color: #4a4; }
    .card-actions .edit-btn:hover   { color: #aaf; }
    .card-actions .save-btn         { color: #4a4; }
    .card-actions .save-btn:hover   { color: #6e6; }
    .card-actions .cancel-btn:hover { color: #c84; }
    .card-actions .del-btn:hover    { color: #c44; }

    /* textarea shown when a note is in edit mode */
    .edit-textarea { width: 100%; min-height: 56px; max-height: 140px; resize: vertical;
                     background: #1a1a1a; border: 1px solid #445; color: #e0e0e0;
                     padding: 4px 8px; border-radius: 3px; font: inherit;
                     line-height: 1.5; margin-top: 4px; }

    /* SQL panel */
    #sql-panel { border-top: 1px solid #2a2a2a; padding: 10px 16px;
                 background: #0f0f0f; display: flex; flex-direction: column; gap: 6px; }
    #sql-panel-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #sql-panel-header label { font-size: 11px; color: #555; }
    #sql-example { background: #1a1a1a; border: 1px solid #333; color: #777;
                   padding: 2px 6px; border-radius: 3px; font: inherit; font-size: 11px; }
    #sql-row { display: flex; gap: 8px; }
    #sql-input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
                 padding: 5px 10px; border-radius: 4px; font: inherit; }
    #sql-run { background: #1a1a2a; border: 1px solid #333; color: #aaf;
               padding: 5px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
    #sql-run:hover { background: #222240; }
    #sql-output { font-size: 11px; color: #7a9; background: #111; padding: 6px 10px;
                  border-radius: 4px; min-height: 24px; white-space: pre-wrap; max-height: 80px;
                  overflow-y: auto; border: 1px solid #222; }

    #log { border-top: 1px solid #222; height: 90px; overflow-y: auto;
           padding: 6px 16px; background: #0a0a0a; }
    .log-line { font-size: 11px; color: #555; line-height: 1.6; }
    .log-line.info   { color: #48b; }
    .log-line.remote { color: #4a4; }
    .log-line.local  { color: #666; }
    .log-line.peer   { color: #a84; }
    .log-line.err    { color: #c44; }

    #status { padding: 4px 16px; background: #0a0a0a; border-top: 1px solid #1a1a1a;
              font-size: 10px; color: #444; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>p2p-db</h2>
    <div class="info-block">
      <label>Storage</label>
      <span id="storage-badge">detecting…</span>
    </div>
    <div class="info-block">
      <label>My peer ID</label>
      <span id="peer-id">starting…</span>
    </div>
    <div class="info-block">
      <label>Relay address (click to copy)</label>
      <span id="relay-addr">waiting for relay…</span>
      <div id="relay-connect">
        <input id="relay-url" type="text" placeholder="https://my-relay.fly.dev">
        <button id="relay-connect-btn">Connect</button>
      </div>
    </div>
    <div class="info-block">
      <label>Notes</label>
      <span id="stats-text">—</span>
    </div>
    <div class="info-block">
      <label>Connected peers (<span id="peer-count">0</span>)</label>
    </div>
    <div id="peer-list"></div>
  </div>

  <div id="main">
    <div id="toolbar">
      <!-- Row 1: add a note -->
      <div class="toolbar-row">
        <input id="note-input" type="text" placeholder="Note text…" maxlength="200">
        <select id="tag-select">
          <option value="general">general</option>
          <option value="work">work</option>
          <option value="idea">idea</option>
          <option value="todo">todo</option>
        </select>
        <button id="add-btn">+ Add</button>
      </div>
      <!-- Row 2: search / filter / sort -->
      <div class="toolbar-row">
        <input id="search-input" type="text" placeholder="Search notes…">
        <select id="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
        <button id="filter-btn">Filter tag</button>
        <button id="filter-clear">Show all</button>
      </div>
    </div>

    <div id="notes"></div>

    <div id="sql-panel">
      <div id="sql-panel-header">
        <label>Raw SQL — kv(key TEXT, value TEXT/JSON)</label>
        <select id="sql-example">
          <option value="">Quick examples…</option>
          <option value="SELECT key, json_extract(value,'$.tag') as tag, json_extract(value,'$.body') as body FROM kv LIMIT 5">List 5 notes</option>
          <option value="SELECT json_extract(value,'$.tag') as tag, COUNT(*) as n FROM kv GROUP BY tag ORDER BY n DESC">Count by tag</option>
          <option value="SELECT COUNT(*) as total, SUM(CASE WHEN json_extract(value,'$.done')=1 THEN 1 ELSE 0 END) as done FROM kv">Done stats</option>
          <option value="SELECT key, json_extract(value,'$.body') as body FROM kv WHERE json_extract(value,'$.done')=1">Done notes</option>
          <option value="SELECT key, json_extract(value,'$.body') as body FROM kv ORDER BY json_extract(value,'$.ts') DESC LIMIT 3">3 newest</option>
          <option value="SELECT key, json_extract(value,'$.author') as author FROM kv GROUP BY json_extract(value,'$.author')">Authors</option>
        </select>
      </div>
      <div id="sql-row">
        <input id="sql-input" type="text"
          value="SELECT key, json_extract(value,'$.tag') as tag, json_extract(value,'$.body') as body FROM kv LIMIT 5">
        <button id="sql-run">Run</button>
      </div>
      <div id="sql-output">— results appear here —</div>
    </div>

    <div id="log"></div>
    <div id="status">initialising…</div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
